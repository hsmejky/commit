name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: test (${{ matrix.os }}, node ${{ matrix.node-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # 22.0.0 is the documented floor (Q1, Q15: FND-01 was verified manually against it).
        # On windows-latest, Node 22.0.0's bundled npm cannot resolve npm-cli.js at all
        # (nodejs/node#52682, actions/setup-node#1025, fixed in 22.1.0); no test of this
        # repo can run there, so the windows "oldest" leg pins the first working patch
        # instead. '22' resolves to the latest 22.x release, '24' to the latest 24.x.
        include:
          - os: ubuntu-latest
            node-version: '22.0.0'
          - os: ubuntu-latest
            node-version: '22'
          - os: ubuntu-latest
            node-version: '24'
          - os: macos-latest
            node-version: '22.0.0'
          - os: macos-latest
            node-version: '22'
          - os: macos-latest
            node-version: '24'
          - os: windows-latest
            node-version: '22.1.0'
          - os: windows-latest
            node-version: '22'
          - os: windows-latest
            node-version: '24'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Clear inherited git identity
        shell: bash
        run: |
          git config --global --unset-all user.name || true
          git config --global --unset-all user.email || true

      - name: Assert powershell.exe and pwsh are both available
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $legacy = Get-Command powershell.exe -ErrorAction SilentlyContinue
          $core = Get-Command pwsh -ErrorAction SilentlyContinue
          if (-not $legacy) { throw "powershell.exe not found" }
          if (-not $core) { throw "pwsh not found" }
          Write-Host "powershell.exe: $($legacy.Source)"
          Write-Host "pwsh: $($core.Source)"

      - name: Run tests
        run: npm test

      # CFG-11 (docs/roadmap/04-config-and-attribution.md; PRE-16; docs/spec/testing-seams.md
      # Seam 1): the managed-settings layer is machine-wide, so its cases live in
      # tests/managed/, outside the tests/*.test.js glob `npm test` runs, and run here as a
      # separate, final node --test invocation. On ubuntu-latest and macos-latest only, the
      # managed directory needs creating and handing to the normal user first (passwordless
      # sudo on both); windows-latest already runs as administrator, so this step is for
      # the other two only.
      - name: Prepare the managed settings directory
        if: matrix.os == 'ubuntu-latest' || matrix.os == 'macos-latest'
        shell: bash
        run: |
          if [ "${{ matrix.os }}" = "macos-latest" ]; then
            dir="/Library/Application Support/ClaudeCode"
          else
            dir="/etc/claude-code"
          fi
          sudo mkdir -p "$dir"
          sudo chown "$USER" "$dir"

      - name: Run managed-layer tests (final, separate invocation)
        shell: bash
        run: node --test "tests/managed/*.test.js"

  min-git:
    name: min-git (ubuntu:22.04 container)
    runs-on: ubuntu-latest
    container:
      image: ubuntu:22.04
      options: --init
    steps:
      - name: Install git and git-lfs, and assert minimum git version (2.34.x)
        run: |
          apt-get update -qq
          # openssh-client (ssh-keygen): without it, EXE-23's SSH-signing cases both skip
          # on this leg, the git version that introduced `gpg.format=ssh` and so the most
          # likely to diverge for that behaviour.
          apt-get install -y --no-install-recommends git git-lfs ca-certificates openssh-client
          ver=$(git --version | sed -E 's/^git version ([0-9]+\.[0-9]+\.[0-9]+).*/\1/')
          echo "git version: $ver"
          case "$ver" in
            2.34.*) echo "OK: git $ver" ;;
            *) echo "expected git 2.34.x, got $ver" >&2; exit 1 ;;
          esac

      - uses: actions/checkout@v4

      - name: Clear inherited git identity
        run: |
          git config --global --unset-all user.name || true
          git config --global --unset-all user.email || true

      - name: Trust the checked-out workspace
        # git 2.34.1 carries the CVE-2022-24765 safe.directory backport; the container runs
        # as root over a workspace actions/checkout wrote as the host runner user, which
        # without this is "dubious ownership" (FND-07).
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Install Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run tests
        env:
          COMMIT_REQUIRE_LFS: '1'
        run: npm test

      # CFG-11: the container runs as root, so the managed directory needs no sudo/chown
      # step here (PRE-16).
      - name: Run managed-layer tests (final, separate invocation)
        run: node --test "tests/managed/*.test.js"
